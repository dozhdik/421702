[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omis_blog*", "scripts*"]

[project]
name = "omis-blog"
version = "0.1.0"
description = "Local corporate blog implementing the baseline UML model"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["omis_blog"]
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["misc"]
